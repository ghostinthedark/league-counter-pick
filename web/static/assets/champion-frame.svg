<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="frameGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0e6d2"/>
      <stop offset="30%" stop-color="#c89b3c"/>
      <stop offset="70%" stop-color="#785a28"/>
      <stop offset="100%" stop-color="#c89b3c"/>
    </linearGradient>
    <linearGradient id="frameInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2328"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="url(#frameGold)" stroke-width="2.5"/>
  <!-- Inner decorative ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#785a28" stroke-width="0.5" stroke-opacity="0.6"/>
  <!-- Corner notches (LoL-inspired) -->
  <path d="M50 2 L54 8 L46 8 Z" fill="#c89b3c"/>
  <path d="M50 98 L54 92 L46 92 Z" fill="#c89b3c"/>
  <path d="M2 50 L8 46 L8 54 Z" fill="#c89b3c"/>
  <path d="M98 50 L92 46 L92 54 Z" fill="#c89b3c"/>
  <!-- Clip area for champion portrait -->
  <circle cx="50" cy="50" r="40" fill="url(#frameInner)"/>
</svg>
