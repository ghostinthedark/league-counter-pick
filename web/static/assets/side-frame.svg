  <rect x="8" y="8" width="304" height="404" rx="1" stroke="#785a28" stroke-width="0.5" stroke-opacity="0.45"/>
  <!-- Corner accents -->
  <path d="M1.5 24 L1.5 1.5 L24 1.5" stroke="#c89b3c" stroke-width="2" stroke-linecap="square"/>
  <path d="M318.5 24 L318.5 1.5 L296 1.5" stroke="#c89b3c" stroke-width="2" stroke-linecap="square"/>
  <path d="M1.5 396 L1.5 418.5 L24 418.5" stroke="#c89b3c" stroke-width="2" stroke-linecap="square"/>
  <path d="M318.5 396 L318.5 418.5 L296 418.5" stroke="#c89b3c" stroke-width="2" stroke-linecap="square"/>
  <!-- Side notch details -->
  <line x1="0" y1="120" x2="14" y2="120" stroke="#c89b3c" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="0" y1="300" x2="14" y2="300" stroke="#c89b3c" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="320" y1="120" x2="306" y2="120" stroke="#c89b3c" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="320" y1="300" x2="306" y2="300" stroke="#c89b3c" stroke-width="1" stroke-opacity="0.5"/>
