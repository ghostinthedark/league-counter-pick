<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" fill="none">
  <defs>
    <linearGradient id="sideGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0e6d2" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#c89b3c"/>
      <stop offset="100%" stop-color="#785a28" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="sideGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#c89b3c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0397ab" stop-opacity="0"/>
