<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1428"/>
      <stop offset="40%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#0d1a30"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#c89b3c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c89b3c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hexGrid" width="28" height="24.25" patternUnits="userSpaceOnUse">
      <path d="M14 0 L28 7.06 L28 17.19 L14 24.25 L0 17.19 L0 7.06 Z" fill="none" stroke="#c89b3c" stroke-opacity="0.06" stroke-width="0.5"/>
    </pattern>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="480" height="320" fill="url(#heroGrad)"/>
  <rect width="480" height="320" fill="url(#hexGrid)"/>
  <rect width="480" height="320" fill="url(#glowGold)"/>
  <!-- Decorative rune lines -->
  <path d="M0 280 Q120 240 240 260 T480 250" fill="none" stroke="#c89b3c" stroke-opacity="0.12" stroke-width="1"/>
  <path d="M0 300 Q160 270 320 290 T480 280" fill="none" stroke="#0397ab" stroke-opacity="0.08" stroke-width="0.8"/>
  <!-- Corner accents -->
  <polygon points="0,0 80,0 0,60" fill="#c89b3c" fill-opacity="0.04"/>
  <polygon points="480,0 400,0 480,60" fill="#c89b3c" fill-opacity="0.04"/>
  <!-- Floating particles -->
  <circle cx="60" cy="80" r="1.5" fill="#c89b3c" fill-opacity="0.3"/>
  <circle cx="180" cy="45" r="1" fill="#c89b3c" fill-opacity="0.2"/>
  <circle cx="320" cy="90" r="1.2" fill="#0397ab" fill-opacity="0.25"/>
  <circle cx="420" cy="55" r="1" fill="#c89b3c" fill-opacity="0.15"/>
  <circle cx="250" cy="120" r="0.8" fill="#f0e6d2" fill-opacity="0.1"/>
  <circle cx="100" cy="150" r="0.6" fill="#c89b3c" fill-opacity="0.2"/>
  <circle cx="380" cy="130" r="0.8" fill="#0397ab" fill-opacity="0.15"/>
</svg>
